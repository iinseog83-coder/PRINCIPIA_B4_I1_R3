  external_closure_authority_vm:
    name: "VM-3: Detached Closure Verifier (Quad-CanSem & Evidence Collection)"
    needs: [external_linux_replay_RE1, external_linux_replay_RE2]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "1. Checkout Repository (Read-Only)"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "2. Provision Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "3. Download RE1 Artifact"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: principia-b4-i1-r3-re1-evidence
          path: ${{ runner.temp }}/principia_b4_i1_r3_closure/re1_in

      - name: "4. Download RE2 Artifact"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: principia-b4-i1-r3-re2-evidence
          path: ${{ runner.temp }}/principia_b4_i1_r3_closure/re2_in

      - name: "5. Install Pinned Lean 4.33.1 via elan"
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "${PINNED_LEAN_TOOLCHAIN}"

      - name: "6. Unpack Bundle, Snapshot Workflow & Execute Closure Verification"
        id: closure_exec
        shell: bash
        env:
          INPUT_BUNDLE_REL: ${{ inputs.bundle_zip_path }}
          RE1_RESULT: ${{ needs.external_linux_replay_RE1.result }}
          RE2_RESULT: ${{ needs.external_linux_replay_RE2.result }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          CLOS_ROOT="${RUNNER_TEMP}/principia_b4_i1_r3_closure"
          FINAL_EV="${CLOS_ROOT}/final_evidence_bundle"
          UNPACK_DIR="/opt/principia_b4_i1_r3_closure_bundle"
          mkdir -p "${FINAL_EV}/re1" "${FINAL_EV}/re2" "${CLOS_ROOT}/re1_in" "${CLOS_ROOT}/re2_in"
          echo "final_ev=${FINAL_EV}" >> "${GITHUB_OUTPUT}"
          cp -r "${CLOS_ROOT}/re1_in/." "${FINAL_EV}/re1/" || true
          cp -r "${CLOS_ROOT}/re2_in/." "${FINAL_EV}/re2/" || true
          IMMUT_LOG="${FINAL_EV}/pre_and_post_immutability_check.txt"
          echo "=== [CLOSURE VM] WORKFLOW & BUNDLE VERIFICATION ===" > "${IMMUT_LOG}"
          echo "UTC Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${IMMUT_LOG}"
          echo "Predecessor Job Results: RE1=${RE1_RESULT} | RE2=${RE2_RESULT}" >> "${IMMUT_LOG}"
          WF_CANDIDATE="${GITHUB_WORKSPACE}/.github/workflows/principia_p1b2b_b4_i1_r3_external_replay.yml"
          if [[ ! -f "${WF_CANDIDATE}" ]]; then
            WF_REL="$(echo "${GITHUB_WORKFLOW_REF:-}" | sed -E 's#^[^/]+/[^/]+/##; s#@.*$##')"
            if [[ -n "${WF_REL}" ]] && [[ -f "${GITHUB_WORKSPACE}/${WF_REL}" ]]; then
              WF_CANDIDATE="${GITHUB_WORKSPACE}/${WF_REL}"
            fi
          fi
          cp -p "${WF_CANDIDATE}" "${FINAL_EV}/executed_workflow_snapshot.yml"
          EXEC_WF_BYTES="$(stat -c%s "${FINAL_EV}/executed_workflow_snapshot.yml")"
          EXEC_WF_SHA="$(sha256sum "${FINAL_EV}/executed_workflow_snapshot.yml" | awk '{print toupper($1)}')"
          sudo rm -rf "${UNPACK_DIR}"
          sudo mkdir -p "${UNPACK_DIR}"
          sudo unzip -q "${GITHUB_WORKSPACE}/${INPUT_BUNDLE_REL}" -d "${UNPACK_DIR}"
          (cd "${UNPACK_DIR}" && sha256sum -c bundle_manifest.sha256) >> "${IMMUT_LOG}"
          BUNDLED_WF_SHA="$(sha256sum "${UNPACK_DIR}/GitHub_Actions_Workflow/principia_p1b2b_b4_i1_r3_external_replay.yml" | awk '{print toupper($1)}')"
          set +e
          PYTHONDONTWRITEBYTECODE=1 python3 -B             "${UNPACK_DIR}/research/principia_omega_cell_c1_p1b2b_b4_i1_verify_kit_r3/run_verify_b4_i1_r3.py"             --mode verify-external-pair             --source-root "${UNPACK_DIR}"             --evidence-dir "${FINAL_EV}"             --r0-oracle-path "${UNPACK_DIR}/preserved_lineage_anchors/b4_i1_precommitted_oracle.json"             --r1-oracle-path "${UNPACK_DIR}/preserved_lineage_anchors/b4_i1_r1_precommitted_oracle.json"             --r2-oracle-path "${UNPACK_DIR}/preserved_lineage_anchors/b4_i1_r2_precommitted_oracle.json"             --a1-audit-receipt-path "${UNPACK_DIR}/preserved_lineage_anchors/i1_r3_a1_cmto_independent_audit_receipt.json"             --re1-dir "${CLOS_ROOT}/re1_in"             --re2-dir "${CLOS_ROOT}/re2_in"             --expected-local-cansem-sha256 "${EXPECTED_LOCAL_CANSEM_SHA256}"             --executed-workflow-sha256 "${EXEC_WF_SHA}"             --executed-workflow-bytes "${EXEC_WF_BYTES}"             --bundled-workflow-sha256 "${BUNDLED_WF_SHA}"
          CLOSURE_RC=$?
          set -e
          echo "closure_rc=${CLOSURE_RC}" >> "${GITHUB_OUTPUT}"
          (cd "${UNPACK_DIR}" && sha256sum -c bundle_manifest.sha256) >> "${IMMUT_LOG}"
          (cd "${FINAL_EV}" && find . -type f ! -name 'artifact_bundle_manifest.sha256' | LC_ALL=C sort | sed 's#^\./##' | xargs sha256sum > artifact_bundle_manifest.sha256)

      - name: "7. Upload Unified External Replay Closure Evidence Bundle"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: principia-p1b2b-b4-i1-r3-external-replay-evidence
          path: ${{ steps.closure_exec.outputs.final_ev }}/**
          if-no-files-found: error
          retention-days: 90

      - name: "8. Enforce Fail-Closed Final Exit Status"
        if: always()
        shell: bash
        env:
          CLOSURE_RC: ${{ steps.closure_exec.outputs.closure_rc }}
          RE1_RESULT: ${{ needs.external_linux_replay_RE1.result }}
          RE2_RESULT: ${{ needs.external_linux_replay_RE2.result }}
        run: |
          set -euo pipefail
          echo "Final Gate Check: RE1=${RE1_RESULT} | RE2=${RE2_RESULT} | CLOSURE_RC=${CLOSURE_RC}"
          test "${RE1_RESULT}" = "success"
          test "${RE2_RESULT}" = "success"
          test "${CLOSURE_RC}" = "0"
